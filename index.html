<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Noxel Studio</title>
<meta name="description" content="A free screenwriting editor with industry-standard formatting, scene navigation and PDF export." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />

<style>
  :root {
    --paper: #faf8f3;
    --page: #ffffff;
    --ink: #1c1813;
    --muted: #6b6357;
    --faint: #9a9184;
    --rule: #e4ded1;
    --rail: #f1ede3;
    --accent: #b0402a;
    --accent-soft: #f0ddd6;
    --shadow: 0 1px 2px rgba(28, 24, 19, .06), 0 12px 32px rgba(28, 24, 19, .10);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --script: "Courier Prime", "Courier New", monospace;
    --ui: "Newsreader", Georgia, serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #16130f;
      --page: #211d17;
      --ink: #ece5d8;
      --muted: #a49a89;
      --faint: #7a7263;
      --rule: #322c22;
      --rail: #1d1913;
      --accent: #e0714f;
      --accent-soft: #3a251d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #16130f;
    --page: #211d17;
    --ink: #ece5d8;
    --muted: #a49a89;
    --faint: #7a7263;
    --rule: #322c22;
    --rail: #1d1913;
    --accent: #e0714f;
    --accent-soft: #3a251d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  ::selection { background: var(--accent-soft); }
  [hidden] { display: none !important; }

  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "nav main" "nav foot";
    height: 100dvh;
  }

  /* ---------- top bar ---------- */
  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    gap: 14px;
    row-gap: 8px;
    flex-wrap: wrap;
    padding: 10px 18px;
    background: var(--page);
    border-bottom: 1px solid var(--rule);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-shrink: 0;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .brand b { color: var(--accent); font-weight: 600; }
  .brand span { color: var(--faint); letter-spacing: .1em; }

  .proj-select {
    font-family: var(--ui);
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 6px 28px 6px 11px;
    max-width: 260px;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%);
    background-position: calc(100% - 15px) center, calc(100% - 10px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .spacer { flex: 1; }

  .tbtn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-family: var(--mono);
    letter-spacing: .02em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tbtn:hover { border-color: var(--accent); color: var(--accent); }
  .tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn.primary:hover { filter: brightness(1.06); color: #fff; }

  .menu-wrap { position: relative; flex-shrink: 0; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    display: flex; flex-direction: column; gap: 4px; padding: 6px;
    background: var(--page); border: 1px solid var(--rule); border-radius: 9px;
    box-shadow: var(--shadow); min-width: 170px;
  }
  .menu .tbtn { justify-content: flex-start; border-color: transparent; background: none; }
  .menu .tbtn:hover { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

  .seg { display: inline-flex; flex-shrink: 0; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
  .seg-btn {
    background: var(--paper); border: 0; padding: 7px 13px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .03em; color: var(--muted);
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
  .seg-btn.active { background: var(--accent); color: #fff; }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- scene navigator ---------- */
  .nav {
    grid-area: nav;
    background: var(--rail);
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    padding: 16px 0 40px;
  }
  .nav h2 {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 18px 10px;
    font-weight: 600;
  }
  .scene-item {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 8px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    padding: 7px 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.35;
  }
  .scene-item:hover { background: var(--accent-soft); }
  .scene-item.active { border-left-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  .scene-item .n { color: var(--faint); }
  .scene-item .slug { text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scene-item .pg { color: var(--faint); font-size: 10px; }
  .nav-empty { color: var(--faint); font-family: var(--mono); font-size: 11px; padding: 4px 18px; }

  /* ---------- editor ---------- */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 34px 20px 140px;
    scroll-behavior: smooth;
  }
  .sheet {
    position: relative;
    width: 640px;
    max-width: 100%;
    margin: 0 auto;
    background: var(--page);
    box-shadow: var(--shadow);
    border-radius: 3px;
    padding: 64px 72px 80px;
    min-height: 840px;
  }
  #cursorLayer { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .peer-bar { position: absolute; left: 0; width: 3px; border-radius: 2px; }
  .peer-flag {
    position: absolute; left: 6px;
    font-family: var(--mono); font-size: 8.5px; font-weight: 600; color: #fff;
    padding: 1px 5px; border-radius: 3px; white-space: nowrap; transform: translateY(-1px);
  }
  @media (max-width: 720px) { .sheet { padding: 40px 26px 60px; } }

  .titlepage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 300px;
    text-align: center;
    padding-bottom: 34px;
    margin-bottom: 34px;
    border-bottom: 1px dashed var(--rule);
    font-family: var(--script);
  }
  .titlepage .t {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 26px;
  }
  .titlepage .by { font-size: 12px; color: var(--muted); }
  .titlepage input {
    font-family: var(--script);
    text-align: center;
    border: 0;
    border-bottom: 1px solid transparent;
    background: none;
    color: inherit;
    font-size: inherit;
    padding: 2px 6px;
  }
  .titlepage input:hover { border-bottom-color: var(--rule); }
  .titlepage input:focus { outline: none; border-bottom-color: var(--accent); }
  .titlepage .t input { text-transform: uppercase; letter-spacing: .04em; width: 24ch; }
  .titlepage .by input { width: 30ch; }
  .titlepage .contact { margin-top: 22px; font-size: 11px; color: var(--faint); }
  .titlepage .contact input { width: 28ch; }

  .script { font-family: var(--script); font-size: 12pt; line-height: 1; color: var(--ink); }
  .block {
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    padding: 0;
    margin: 12pt 0 0;
    min-height: 1em;
  }
  .block:first-child { margin-top: 0; }
  .block[data-type="scene"] {
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 24pt;
  }
  .block[data-type="scene"]:first-child { margin-top: 0; }
  .block[data-type="action"] {}
  .block[data-type="character"] {
    text-transform: uppercase;
    margin-left: 2.2in;
    margin-top: 12pt;
  }
  .block[data-type="paren"] {
    margin-left: 1.6in;
    margin-right: 2in;
  }
  .block[data-type="dialogue"] {
    margin-left: 1in;
    margin-right: 1.5in;
  }
  .block[data-type="transition"] {
    text-transform: uppercase;
    text-align: right;
    margin-top: 12pt;
  }
  .block.empty::before {
    content: attr(data-ph);
    color: var(--faint);
    pointer-events: none;
  }
  .block[data-type="scene"].empty::before { content: "INT./EXT. LOCATION - DAY"; }
  .block[data-type="character"].empty::before { content: "CHARACTER"; }
  .block[data-type="transition"].empty::before { content: "CUT TO:"; }
  .block[data-type="paren"].empty::before { content: "(beat)"; }
  .block[data-type="dialogue"].empty::before { content: "Dialogue..."; }
  .block[data-type="action"].empty::before { content: "Action..."; }

  /* element type pill that follows the caret */
  .typetag {
    position: fixed;
    z-index: 20;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--page);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 3px 9px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity .12s, transform .12s;
  }
  .typetag.show { opacity: 1; transform: none; }

  #autocomplete {
    position: fixed; z-index: 30;
    background: var(--page); border: 1px solid var(--rule); border-radius: 7px;
    box-shadow: var(--shadow); overflow: hidden; min-width: 150px;
    font-family: var(--mono); font-size: 12px;
  }
  .ac-item { padding: 6px 11px; cursor: pointer; text-transform: uppercase; color: var(--muted); }
  .ac-item.on, .ac-item:hover { background: var(--accent-soft); color: var(--ink); }

  /* ---------- footer ---------- */
  .foot {
    grid-area: foot;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 8px 20px;
    background: var(--page);
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .foot .k { color: var(--faint); }
  .foot .hint { margin-left: auto; color: var(--faint); }
  .foot kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--muted);
  }

  /* ---------- modal ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(20, 16, 12, .5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .scrim.open { display: flex; }
  .modal {
    background: var(--page);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: var(--shadow);
    width: 460px;
    max-width: 100%;
    padding: 24px;
  }
  .modal h3 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin: 0 0 14px;
    color: var(--accent);
  }
  .modal label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 12px 0 4px;
  }
  .modal input[type="text"], .modal textarea {
    width: 100%;
    font-family: var(--ui);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .modal textarea { font-family: var(--mono); font-size: 11px; resize: vertical; min-height: 90px; }
  .modal input:focus, .modal textarea:focus, .proj-select:focus, .scene-item:focus-visible, .tbtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal .msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 1em; }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-areas: "top" "main" "foot"; }
    .nav { display: none; }
    .brand span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }

  /* ---------- breakdown ---------- */
  #breakdown { display: none; max-width: 880px; margin: 0 auto; }
  body[data-mode="breakdown"] .sheet { display: none; }
  body[data-mode="breakdown"] #breakdown { display: block; }

  .bd-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .bd-bar .ttl {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint);
  }
  .bd-bar .grow { flex: 1; }
  .bd-empty { font-family: var(--mono); font-size: 12px; color: var(--faint); padding: 40px 0; text-align: center; }

  .bd-card {
    background: var(--page); border: 1px solid var(--rule); border-radius: 9px;
    padding: 18px 20px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .bd-head { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: baseline; }
  .bd-head .sn { font-family: var(--mono); font-weight: 600; color: var(--accent); font-size: 13px; }
  .bd-head .slug { font-family: var(--script); text-transform: uppercase; font-weight: 700; font-size: 13px; }
  .bd-head .pg { font-family: var(--mono); font-size: 10px; color: var(--faint); }

  .bd-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 12px 42px; }
  .bd-meta label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); display: flex; flex-direction: column; gap: 3px;
  }
  .bd-meta input {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px;
  }
  .bd-meta input.ie { width: 74px; } .bd-meta input.dn { width: 96px; }
  .bd-meta input.set { width: 210px; } .bd-meta input.eig { width: 62px; }

  .bd-syn {
    display: block; width: calc(100% - 42px); margin: 0 0 14px 42px;
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 7px 9px; resize: vertical; min-height: 38px;
  }
  .bd-cats {
    margin-left: 42px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px 18px;
  }
  .bd-cat > span {
    display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .11em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 5px;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    border-bottom: 1px solid var(--rule); padding-bottom: 5px; min-height: 26px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-soft); color: var(--ink); border-radius: 999px;
    padding: 2px 4px 2px 9px; font-size: 11px; font-family: var(--mono);
  }
  .chip.auto { background: transparent; border: 1px dashed var(--rule); color: var(--muted); }
  .chip button { background: none; border: 0; color: var(--muted); font-size: 12px; line-height: 1; padding: 0 2px; cursor: pointer; }
  .chip button:hover { color: var(--accent); }
  .chip-in {
    border: 0; background: none; font-family: var(--mono); font-size: 11px;
    color: var(--ink); padding: 3px 2px; min-width: 70px; flex: 1; outline: none;
  }
  .chip-in::placeholder { color: var(--faint); }
  .bd-cat.wide { grid-column: 1 / -1; }

  /* ---------- shared panel chrome ---------- */
  #shots, #schedule, #budget { display: none; max-width: 900px; margin: 0 auto; }
  body[data-mode="shots"] .sheet,
  body[data-mode="schedule"] .sheet,
  body[data-mode="budget"] .sheet { display: none; }
  body[data-mode="shots"] #shots,
  body[data-mode="schedule"] #schedule,
  body[data-mode="budget"] #budget { display: block; }
  body[data-mode="shots"] #breakdown,
  body[data-mode="schedule"] #breakdown,
  body[data-mode="budget"] #breakdown { display: none; }

  .panel-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .panel-bar .ttl {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint);
  }
  .panel-bar .grow { flex: 1; }
  .panel-empty { font-family: var(--mono); font-size: 12px; color: var(--faint); padding: 40px 0; text-align: center; }

  /* ---------- shots ---------- */
  .shot-scene { margin-bottom: 26px; }
  .shot-scene > h3 {
    font-family: var(--script); font-size: 13px; font-weight: 700; text-transform: uppercase;
    margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px;
  }
  .shot-scene > h3 .sn { font-family: var(--mono); color: var(--accent); }
  .shot-scene > h3 .pg { font-family: var(--mono); font-size: 10px; color: var(--faint); font-weight: 400; }
  .shot {
    display: grid; grid-template-columns: 34px 1fr 1fr 1fr 1fr; gap: 9px 12px;
    align-items: start; background: var(--page); border: 1px solid var(--rule);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
  }
  .shot.done { opacity: .55; }
  .shot .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .shot .cell select, .shot .cell input { width: 100%; }
  .shot .desc { grid-column: 2 / -1; }
  .shot .desc textarea { min-height: 34px; }
  .shot label {
    font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  }
  .shot select, .shot input, .shot textarea {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 4px 6px;
  }
  .shot .num { font-family: var(--mono); font-weight: 600; color: var(--accent); font-size: 13px; padding-top: 14px; }
  .shot textarea { resize: vertical; min-height: 30px; width: 100%; font-family: var(--ui); }
  .shot .sb {
    grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    border-top: 1px dashed var(--rule); margin-top: 4px; padding-top: 8px;
  }
  .sb img { height: 78px; border-radius: 5px; border: 1px solid var(--rule); display: block; }
  .sb .thumb-btn {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 12px; background: var(--paper); cursor: pointer;
  }
  .shot-row-tools { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: 0; color: var(--faint); font-family: var(--mono); font-size: 12px; cursor: pointer; padding: 2px 5px;
  }
  .icon-btn:hover { color: var(--accent); }

  /* ---------- schedule / stripboard ---------- */
  .sched-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .day-col { background: var(--rail); border: 1px solid var(--rule); border-radius: 9px; padding: 12px 14px; }
  .day-col.pool { background: transparent; border-style: dashed; }
  .day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .day-head input.dl {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink);
    background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 2px 2px 3px;
  }
  .day-head input.dd {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    background: var(--page); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 6px;
  }
  .day-head .tot { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-left: auto; }
  .strip {
    display: grid; grid-template-columns: 26px 46px 1fr auto auto; gap: 9px; align-items: center;
    padding: 6px 10px; border: 1px solid rgba(0,0,0,.14); border-radius: 5px; margin-bottom: 5px;
    font-family: var(--mono); font-size: 11px; color: #1a1a1a;
  }
  .strip .st-slug { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
  .strip .st-n { font-weight: 700; }
  .strip select {
    font-family: var(--mono); font-size: 10px; border: 1px solid rgba(0,0,0,.2);
    border-radius: 4px; padding: 1px 3px; background: rgba(255,255,255,.6); color: #1a1a1a; max-width: 108px;
  }
  .strip.int-day { background: #f4f1e9; }
  .strip.int-night { background: #cdd9e8; }
  .strip.ext-day { background: #f2e4a8; }
  .strip.ext-night { background: #cbe0c0; }
  .strip.unset { background: #e7e3da; }
  .strip .mv { color: #555; cursor: grab; }
  .strip-legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-bottom: 6px; }
  .strip-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); margin-right: 4px; vertical-align: -1px; }

  /* ---------- call sheet ---------- */
  .cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; margin: 12px 0; }
  .cs-grid label { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .cs-grid input, .cs-full textarea {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 4px 6px;
  }
  .cs-full { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; font-family: var(--mono); font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .cs-full textarea { resize: vertical; min-height: 54px; }

  #callsheet-print { display: none; }

  /* ---------- budget ---------- */
  .bg-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  .bg-table th {
    text-align: left; font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--rule); font-weight: 600;
  }
  .bg-table td { padding: 3px 6px; border-bottom: 1px solid var(--rule); }
  .bg-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bg-table input, .bg-table select {
    width: 100%; font-family: var(--mono); font-size: 11.5px; color: var(--ink);
    background: none; border: 0; padding: 3px 2px;
  }
  .bg-table input:focus, .bg-table select:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .bg-table input.r { text-align: right; }
  .bg-cat-row td { background: var(--rail); font-weight: 600; text-transform: uppercase; font-size: 9px; letter-spacing: .08em; color: var(--muted); }
  .bg-total { display: flex; justify-content: flex-end; gap: 18px; align-items: baseline; margin-top: 16px; font-family: var(--mono); }
  .bg-total .amt { font-size: 20px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- cloud ---------- */
  .cloud-pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; color: var(--muted); cursor: pointer;
  }
  .cloud-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .cloud-pill.on { border-color: var(--accent); color: var(--accent); }
  .cloud-pill.on .dot { background: var(--accent); }
  .cloud-pill.sync .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .seg-btn.mini { padding: 7px 10px; }

  /* ---------- presence ---------- */
  .peers { display: flex; align-items: center; gap: -4px; }
  .peer {
    width: 24px; height: 24px; border-radius: 50%; margin-left: -6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9px; font-weight: 600; color: #fff;
    background: var(--pc, #888); border: 2px solid var(--page); cursor: default;
  }
  .peer:first-child { margin-left: 0; }

  /* ---------- comments ---------- */
  .scene-item .cm {
    font-family: var(--mono); font-size: 9px; color: #fff; background: var(--accent);
    border-radius: 999px; padding: 0 5px; min-width: 15px; text-align: center;
  }
  .cm-scene { margin-bottom: 16px; }
  .cm-scene > h4 {
    font-family: var(--script); font-size: 12px; font-weight: 700; text-transform: uppercase;
    margin: 0 0 8px; color: var(--muted);
  }
  .cm-item {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 7px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
  }
  .cm-item.resolved { opacity: .5; }
  .cm-item .meta { font-family: var(--mono); font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; margin-bottom: 3px; }
  .cm-item .meta button { background: none; border: 0; color: var(--accent); font-family: var(--mono); font-size: 9px; cursor: pointer; padding: 0; }
  .cm-add { display: flex; gap: 6px; margin-top: 4px; }
  .cm-add select, .cm-add input {
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
  }
  .cm-add input { flex: 1; }
  .modal.wide { width: 560px; max-height: 78vh; display: flex; flex-direction: column; }
  .modal.wide .cm-body { overflow-y: auto; flex: 1; margin: 4px -4px; padding: 0 4px; }

  .strip[draggable="true"] { cursor: grab; }
  .strip.drag-over { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .day-col.drop-hot { background: var(--accent-soft); }

  /* ---------- print / PDF ---------- */
  @media print {
    @page { size: letter; margin: 1in 1in 1in 1.5in; }
    body { background: #fff; color: #000; }
    .topbar, .nav, .foot, .typetag, .scrim, #breakdown, #shots, #schedule, #budget, #cursorLayer { display: none !important; }
    .app { display: block; height: auto; }
    .main { overflow: visible; padding: 0; }
    body.printing-cs { }
    body.printing-cs .sheet { display: none !important; }
    body.printing-cs #callsheet-print { display: block !important; font-family: var(--mono); color: #000; }
    #callsheet-print h1 { font-size: 15px; margin: 0 0 6px; }
    #callsheet-print h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin: 14px 0 4px; border-bottom: 1px solid #000; }
    #callsheet-print table { width: 100%; border-collapse: collapse; font-size: 8.5px; table-layout: fixed; margin-bottom: 8px; }
    #callsheet-print td, #callsheet-print th { border: 1px solid #999; padding: 2px 4px; text-align: left; word-break: break-word; vertical-align: top; }
    #callsheet-print .kv { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 11px; margin: 6px 0; }
    .sheet {
      width: auto; max-width: none; margin: 0;
      box-shadow: none; border-radius: 0; padding: 0; min-height: 0;
    }
    .titlepage {
      min-height: 8in;
      justify-content: center;
      border: 0;
      page-break-after: always;
      color: #000;
    }
    .titlepage input { border: 0 !important; }
    .script { font-size: 12pt; color: #000; }
    .block.empty::before { content: "" !important; }
    .block[data-type="scene"] { page-break-after: avoid; }
    .block[data-type="character"] { page-break-after: avoid; }
  }
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <div class="brand"><b>NOXEL</b><span>Studio</span></div>
    <select class="proj-select" id="projSelect" aria-label="Choose script"></select>
    <button class="tbtn" id="newBtn" title="New script">+ New</button>
    <div class="seg" role="tablist" aria-label="Mode">
      <button class="seg-btn mini active" id="mode-write" role="tab" data-mode="write">Write</button>
      <button class="seg-btn mini" id="mode-breakdown" role="tab" data-mode="breakdown">Breakdown</button>
      <button class="seg-btn mini" id="mode-shots" role="tab" data-mode="shots">Shots</button>
      <button class="seg-btn mini" id="mode-schedule" role="tab" data-mode="schedule">Schedule</button>
      <button class="seg-btn mini" id="mode-budget" role="tab" data-mode="budget">Budget</button>
    </div>
    <div class="spacer"></div>
    <div class="peers" id="peers" hidden></div>
    <button class="cloud-pill" id="cloudPill" title="Sync this library to the cloud"><span class="dot"></span><span id="cloudTxt">Local</span></button>
    <button class="tbtn" id="notesBtn">Notes</button>
    <button class="tbtn primary" id="pdfBtn">Export PDF</button>
    <div class="menu-wrap">
      <button class="tbtn" id="moreBtn" aria-haspopup="true" aria-expanded="false" title="More">More</button>
      <div class="menu" id="moreMenu" hidden>
        <button class="tbtn" id="titleBtn">Title page</button>
        <button class="tbtn" id="dataBtn">Backup &amp; formats</button>
        <button class="tbtn" id="themeBtn">Toggle theme</button>
      </div>
    </div>
  </header>

  <nav class="nav" id="nav">
    <h2>Scenes</h2>
    <div id="sceneList"></div>
  </nav>

  <main class="main" id="main">
    <div class="sheet" id="sheet">
      <div id="cursorLayer"></div>
      <div class="titlepage" id="titlepage"></div>
      <div class="script" id="script"></div>
    </div>
    <div id="breakdown"></div>
    <div id="shots"></div>
    <div id="schedule"></div>
    <div id="budget"></div>
    <div id="callsheet-print"></div>
  </main>

  <footer class="foot">
    <span><span class="k">Pages</span> <span id="stPages">1</span></span>
    <span><span class="k">Scenes</span> <span id="stScenes">0</span></span>
    <span><span class="k" id="stWordsK">Words</span> <span id="stWords">0</span></span>
    <span><span class="k">Saved</span> <span id="stSaved">just now</span></span>
    <span class="hint"><kbd>Tab</kbd> change element &nbsp; <kbd>Enter</kbd> next &nbsp; <kbd>&#9166;</kbd> auto-flow</span>
  </footer>
</div>

<div class="typetag" id="typetag">Action</div>
<div id="autocomplete" hidden></div>

<div class="scrim" id="scrim">
  <div class="modal" id="modal"></div>
</div>

<script type="module" src="/src/adapter.js"></script>


</body>
</html>
